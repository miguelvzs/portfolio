<!doctype html>
<!-- Modelo da imagem de compartilhamento (1200 x 630). Mesmas fontes, cores e foto do site. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Geist"; src: url("../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background-color: #0b2340;
    background-image: radial-gradient(ellipse 80% 60% at 70% -10%, rgb(23 74 114 / 70%), transparent 70%);
    color: #e6eef8;
    font-family: "Geist", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 90px;
  }
  img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #0b2340; box-shadow: 0 10px 30px rgb(0 0 0 / 35%); }
  h1 { margin-top: 26px; font-size: 92px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .role { margin-top: 22px; font-family: "Geist Mono", monospace; font-size: 30px; color: #8fc0ff; }
  .line { margin-top: 26px; font-size: 34px; line-height: 1.3; color: #c3d5ea; max-width: 980px; }
  .url { position: absolute; bottom: 34px; font-family: "Geist Mono", monospace; font-size: 22px; color: #9db8d6; }
</style>
</head>
<body>
  <img src="../src/assets/avatar.webp" alt="" />
  <h1>Miguel Vaz</h1>
  <p class="role">Desenvolvedor Full Stack · AI Engineering</p>
  <p class="line">Levo sistemas à produção de ponta a ponta, com IA integrada onde ela resolve problema de verdade.</p>
  <p class="url">miguelvaz.vercel.app</p>
</body>
</html>
